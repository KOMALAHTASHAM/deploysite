<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeploySite</title>
<style>
  :root { --bg: #f7f7f5; --ink: #1a1d23; --accent: #0b4fd1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --ink: #f0f1f3; --accent: #8ab4ff; }
  }
  body {
    margin: 0;
    padding: 3rem 1.25rem;
    background: var(--bg);
    color: var(--ink);
    font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 38rem; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  code { background: rgba(127,127,127,.18); padding: .1rem .35rem; border-radius: 4px; }
  a { color: var(--accent); }
  a:focus-visible { outline: 3px solid #ff6a00; outline-offset: 2px; }
  .version { margin-top: 2rem; padding: 1rem; border: 2px solid var(--ink); border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>DeploySite</h1>
  <p>This page is served straight from a Git repository on a free static host. Every push to the main branch redeploys it automatically.</p>

  <div class="version">
    <strong>Deployment:</strong> <span id="deploy-label">v1 – first deploy</span>
  </div>

  <p>To confirm auto-redeploy, change the label above to <code>v2 – redeployed</code>, then commit and push.</p>
</main>
</body>
</html>
